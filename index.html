const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter,
       hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.getElementById("gate").hidden = true;
  const el = document.getElementById("brief");
  el.innerHTML = html;
  el.hidden = false;
}

async function attempt(pw, quiet) {
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  go.disabled = true;
  if (!quiet) err.textContent = "Decrypting...";
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem("radar-pw", pw);   // survive a refresh only
    show(html);
  } catch (e) {
    sessionStorage.removeItem("radar-pw");
    err.textContent = quiet ? "" : "Wrong passphrase.";
    go.disabled = false;
    document.getElementById("pw").select();
  }
}

document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  attempt(document.getElementById("pw").value, false);
});

// If this tab already unlocked once, skip the prompt.
const saved = sessionStorage.getItem("radar-pw");
if (saved) attempt(saved, true);
</script>
